name: Deploy to GitHub Pages

# Publishes the static frontend (web/) plus the certified production database. This workflow never
# runs the generator, evolution or certification: it only re-validates what is already committed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Frontend tests
        working-directory: web
        run: npm test
      - name: Validate production database (fails the build when invalid)
        run: python scripts/validate_production_database.py
      - name: Build dist
        run: node scripts/build_pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
